<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <title>Talk Control - RevealJS extension - Demo</title>

        <meta name="description" content="A Theme for slides with RevealJS " />
        <meta name="author" content="Jean-François Garreau AKA jefBinomed" />

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent" />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        <script type="module" src="./scripts/slides.js"></script>
        <link
            rel="stylesheet"
            type="text/css"
            href="./web_modules/talk-control-revealjs-extensions/talk-control-revealjs-theme.css"
            id="theme" />
        <!--
            Overrides the embedded highlight.js code theme (see
            docs/code.md, "Changing the highlight.js theme"). Shipped by
            the library in dist/highlight/ (see package.json "exports"),
            loaded here after the main theme so it wins the cascade at
            equal selector specificity. Disabled by default: only enabled
            (see ./scripts/slides.js) when data-theme=sample is active, so
            the demo's default rendering never changes.
        -->
        <link
            rel="stylesheet"
            type="text/css"
            href="./web_modules/talk-control-revealjs-extensions/highlight/atom-one-light.light.css"
            id="theme-highlight-light"
            disabled />
        <link
            rel="stylesheet"
            type="text/css"
            href="./web_modules/talk-control-revealjs-extensions/highlight/atom-one-dark.dark.css"
            id="theme-highlight-dark"
            disabled />
        <link rel="stylesheet" type="text/css" href="./demo.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./theme-sample.css"
            id="theme-sample" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./theme-dark.css"
            id="theme-dark" />
    </head>

    <body>
        <div class="reveal">
            <!-- Any section element inside of this container is displayed as a slide -->
            <div class="slides"></div>
        </div>
    </body>
</html>
